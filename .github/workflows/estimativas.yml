name: estimativas

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: estimativas
  cancel-in-progress: false

jobs:
  estimar:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependências fixadas
        run: pip install -r requirements.txt
      - id: pages
        uses: actions/configure-pages@v6
      - id: estimar
        name: Estimar
        continue-on-error: true
        run: python -m alertaencosta.estimar --saida site/estimativas.json
      - name: Conferir idade da página publicada
        if: steps.estimar.outcome == 'failure'
        run: |
          echo "::warning::Coleta falhou; a página mantém a última estimativa."
          python -m alertaencosta.idade_publicada "${{ steps.pages.outputs.base_url }}/estimativas.json" --max-horas 24
      - if: steps.estimar.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: publicacao
        if: steps.estimar.outcome == 'success'
        uses: actions/deploy-pages@v5
